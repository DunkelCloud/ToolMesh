name: MCP Registry

# Publishes server.json (io.github.DunkelCloud/toolmesh) to the official MCP
# registry, https://registry.modelcontextprotocol.io, on every release tag, so
# the listing cannot drift from the released version again.
#
# Authentication is GitHub Actions OIDC: the registry grants publish rights for
# io.github.<repository_owner>/* to any workflow of this repository. No stored
# secret and no personal account are involved.
#
# The job waits until the Docker workflow — which runs in parallel on the same
# tag push — has pushed the image with the same version: the registry must
# never advertise a version whose image does not exist.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish without the v prefix (e.g. 0.4.1). The image with this tag must already exist on ghcr.io."
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write # OIDC token for the registry
    env:
      # Pin mcp-publisher; bump version and checksum together. The checksum is
      # the SHA-256 of mcp-publisher_linux_amd64.tar.gz from that release's
      # sigstore bundle.
      MCP_PUBLISHER_VERSION: v1.8.1
      MCP_PUBLISHER_SHA256: a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc
      IMAGE_PATH: dunkelcloud/toolmesh # on ghcr.io
      SERVER_NAME_ENCODED: io.github.DunkelCloud%2Ftoolmesh
    steps:
      - uses: actions/checkout@v6

      - name: Determine version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            VERSION="${INPUT_VERSION#v}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          if ! printf '%s' "${VERSION}" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$'; then
            echo "::error::not a release version: '${VERSION}'"
            exit 1
          fi
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "publishing version ${VERSION}"

      - name: Wait for the Docker image
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # Anonymous pull token for the public package; the manifest endpoint
          # answers 200 once the tag exists and 404 until then.
          TOKEN=$(curl -sSf "https://ghcr.io/token?scope=repository:${IMAGE_PATH}:pull" | jq -r .token)
          for i in $(seq 1 30); do
            CODE=$(curl -sS -o /dev/null -w '%{http_code}' \
              -H "Authorization: Bearer ${TOKEN}" \
              -H "Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.oci.image.manifest.v1+json" \
              "https://ghcr.io/v2/${IMAGE_PATH}/manifests/${VERSION}")
            if [ "${CODE}" = "200" ]; then
              echo "ghcr.io/${IMAGE_PATH}:${VERSION} exists"
              exit 0
            fi
            echo "attempt ${i}/30: ghcr.io/${IMAGE_PATH}:${VERSION} not there yet (HTTP ${CODE}); waiting 30s"
            sleep 30
          done
          echo "::error::ghcr.io/${IMAGE_PATH}:${VERSION} did not appear within 15 minutes; not publishing to the registry"
          exit 1

      - name: Install mcp-publisher
        run: |
          curl -sSfL -o mcp-publisher.tar.gz \
            "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          echo "${MCP_PUBLISHER_SHA256}  mcp-publisher.tar.gz" | sha256sum -c -
          tar -xzf mcp-publisher.tar.gz mcp-publisher

      - name: Set the version in server.json
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          jq --arg v "${VERSION}" '.version = $v' server.json > server.json.tmp
          mv server.json.tmp server.json
          ./mcp-publisher validate

      - name: Publish
        run: |
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish

      - name: Verify the registry entry
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          ENTRY=$(curl -sSf "https://registry.modelcontextprotocol.io/v0/servers/${SERVER_NAME_ENCODED}/versions" \
            | jq -c --arg v "${VERSION}" '.servers[] | select(.server.version == $v) | ._meta["io.modelcontextprotocol.registry/official"]')
          if [ -z "${ENTRY}" ]; then
            echo "::error::version ${VERSION} is not listed by the registry after publishing"
            exit 1
          fi
          echo "registry entry for ${VERSION}: ${ENTRY}"
          if [ "$(printf '%s' "${ENTRY}" | jq -r .isLatest)" != "true" ]; then
            echo "::warning::version ${VERSION} is listed but not marked isLatest — a newer version exists?"
          fi
